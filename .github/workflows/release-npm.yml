name: Release (npm)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # canonical version tag push (e.g. v1.2.3), no pre-release

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # 1. Check whether the tag is on the master branch
  check-branch:
    runs-on: ubuntu-24.04
    outputs:
      is_master: ${{ steps.check.outputs.is_master }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if tag is on master
        id: check
        run: |
          git fetch origin master
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "✅ Tag ${{ github.ref }} is on master branch. Proceeding with release."
            echo "is_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Tag ${{ github.ref }} is not on master branch. Skipping release."
            echo "is_master=false" >> "$GITHUB_OUTPUT"
          fi

  # 2. Creates the GitHub release from the dist/ package tarball present
  #    at the tagged release commit; no build step runs here and no
  #    build-preparatory check is executed (DES-042, DES-043)
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "categories": [
               { "title": "## ⛰️ Features", "labels": ["new"] },
               { "title": "## 🏗️ Implementations", "labels": ["implement"] },
               { "title": "## 🐛 Bug Fixes", "labels": ["fix"] },
               { "title": "## 🚜 Changes", "labels": ["change"] },
               { "title": "## 🎯 Cover Requirements", "labels": ["cover"] },
               { "title": "## ✨ Refactor", "labels": ["refactor"] },
               { "title": "## 📚 Documentation", "labels": ["docs"] },
               { "title": "## 🎨 Styling", "labels": ["style"] },
               { "title": "## ◀️ Revert", "labels": ["revert"] },
               { "title": "## ⚙️ Miscellaneous Tasks", "labels": ["misc"] },
               { "title": "## 💬 Other", "labels": ["other"] },
               { "title": "## ❓ Unknown", "labels": ["unknown"] },
               { "title": "## 🚀 Release", "labels": ["release"] }
             ],
             "ignore_labels": [
                "release",
                "ignore"
             ],
             "transformers": [
              {
                "pattern": "^[^\\(:\\s]+(\\([^\\)]+\\))?!?:\\s+([\\S]+[\\s\\S]*)",
                "target": "$2 $1"
              }
             ],
             "sort": {
                "order": "ASC",
                "on_property": "mergedAt"
             },
             "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n\n**Full Changelog**: [#{{FROM_TAG}}...#{{TO_TAG}}](https://github.com/#{{OWNER}}/#{{REPO}}/compare/#{{FROM_TAG}}...#{{TO_TAG}})",
              "label_extractor": [
               {
                 "pattern": "^([^\\(:\\s]+)(\\([^\\)]+\\))?(!)?:\\s+([\\S]+[\\s\\S]*)",
                 "on_property": "title",
                 "target": "$1"
               }
             ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          name: ${{github.event.repository.name}} ${{ github.ref_name }}
          body: ${{ steps.build_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. Publishes the dist/ package tarball present at the tagged release
  #    commit to npm via OIDC Trusted Publishing (runs only when the tag
  #    is on the master branch)
  publish-npm:
    needs: [check-branch, release]
    if: needs.check-branch.outputs.is_master == 'true'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js for npm OIDC trusted publishing
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: npm publish dist/*.tgz
